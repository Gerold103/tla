# The ForwardRaft test matrix. gen.py turns each entry into <name>.cfg from
# template.cfg. Every config must pass. The order is the run order, by the
# estimated size, smallest first, so that a run gets through as many configs
# as it can before the ones taking a day. The names carry the position, so a
# shell glob over the generated dir lists them in this order. Measured on the
# 16-core server, 2026-10-09: 01 3 s, 02 7 s, 03 9 s, 04 26 s, 05 838 s,
# 06 1649 s, 07 hours (deadlocked at depth 55 after 13 h, see the review
# doc). 08 with two txns and 6 of 9 PROMOTEs passed 3.4B states in two days
# at depth 29 of ~50 and was abandoned; it is now one txn and 4 PROMOTEs,
# its size still to be measured.
#
# Depth: max_term 4 allows three promotions, which is what the deepest known
# pattern needs - a chain through a chain, a poisoned entry covered by a
# later promotion of its origin, three fork sides. max_term 3 is for smoke.
#
# Voters vote and observe terms but receive no rows, so a quorum above the
# data node count can never confirm a PROMOTE. Such combinations are left
# out.
#
# max_promotes caps the PROMOTEs the whole cluster writes; the natural
# maximum is data nodes * (max_term - 1), the default 999 never binds. A cap
# cuts the breadth of a big run and keeps its depth; the witnesses show
# which scenarios survive it.

configs:

  - name: 01_majority_d2v0_q2_t4
    note: every ack required, no fork possible
    data_nodes: 2
    voters: 0
    quorum: 2
    max_term: 4
    transactions: 2

  - name: 02_majority_d2v1_q2_t4
    note: a voter decides elections, data nodes ack alone
    data_nodes: 2
    voters: 1
    quorum: 2
    max_term: 4
    transactions: 2

  - name: 03_majority_d3v0_q2_t3
    note: smoke test, majority
    data_nodes: 3
    voters: 0
    quorum: 2
    max_term: 3
    transactions: 2

  - name: 04_bad_d2v0_q1_t4
    note: every node elects itself
    data_nodes: 2
    voters: 0
    quorum: 1
    max_term: 4
    transactions: 2

  - name: 05_majority_d3v0_q2_t4
    note: the full majority run
    data_nodes: 3
    voters: 0
    quorum: 2
    max_term: 4
    transactions: 2

  - name: 06_bad_d3v0_q1_t3
    note: smoke test, two-sided forks
    data_nodes: 3
    voters: 0
    quorum: 1
    max_term: 3
    transactions: 2

  - name: 07_majority_d3v2_q3_t4
    note: two voters, every data node must ack; covers d3v1_q3 with one voter idle
    data_nodes: 3
    voters: 2
    quorum: 3
    max_term: 4
    transactions: 2

  - name: 08_bad_d3v0_q1_t4
    note: >-
      three sides, all links can break, three promotions deep; one txn and
      4 of the 9 possible PROMOTEs - the two-txn data forks are 06's, the
      three-promotion patterns need no second txn and at most four PROMOTEs
    data_nodes: 3
    voters: 0
    quorum: 1
    max_term: 4
    max_promotes: 4
    transactions: 1
